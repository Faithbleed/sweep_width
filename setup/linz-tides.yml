name: Update LINZ tide predictions

on:
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  schedule:
    - cron: "17 3 1 * *"        # 03:17 UTC on the 1st of every month
  push:
    paths:
      - ".github/workflows/linz-tides.yml"
      - "tools/fetch_linz_tides.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and convert LINZ tide tables
        run: python tools/fetch_linz_tides.py
      - name: Save to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tides
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update LINZ tide predictions"
            git push
          fi
